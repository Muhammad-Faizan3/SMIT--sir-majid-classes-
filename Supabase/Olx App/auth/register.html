<!DOCTYPE html>
<html>

<head>

    <title>Register - MarketHub</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <header>

        <nav>

            <h2 class="logo">
                MarketHub
            </h2>


            <ul>

                <li>Home</li>
                <li>Services</li>
                <li>Buyers</li>
                <li>Sellers</li>
                <li>Contact</li>

            </ul>


            <button>
                Login
            </button>


        </nav>

    </header>



    <section class="auth">


        <div class="form-box">


            <h1>Create Account</h1>


            <p>Join buyers and sellers</p>


            <form>


                <input type="text" placeholder="Full Name">


                <input type="email" placeholder="Email">


                <input type="password" placeholder="Password">


                <select>

                    <option>
                        Select Account Type
                    </option>

                    <option>
                        Buyer
                    </option>

                    <option>
                        Seller
                    </option>

                </select>


                <button>
                    Register
                </button>



                <p>

                    Already have account?

                    <a href="login.html">
                        Login
                    </a>

                </p>


            </form>


        </div>



        <div class="auth-image">


            <img src="https://images.unsplash.com/photo-1556761175-b413da4baf72">


        </div>


    </section>



</body>

</html>
